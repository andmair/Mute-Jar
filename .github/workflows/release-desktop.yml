name: Build & Release Desktop Installers

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-installers:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            os_folder: macos
            os_label: macOS (Universal .dmg)
          - platform: windows-latest
            args: ''
            os_folder: windows
            os_label: Windows (.exe / .msi)
          - platform: ubuntu-22.04
            args: ''
            os_folder: linux
            os_label: Linux (.AppImage / .deb)

    name: Build ${{ matrix.os_label }}
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust / Tauri build dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux WebKitGTK dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Type-check TypeScript
        run: npm run lint

      - name: Generate platform icons from app icon
        run: npm run desktop:icons

      - name: Build single-file OS installers
        run: npx --yes @tauri-apps/cli@^2 build ${{ matrix.args }}

      - name: Stage installers into OS folder
        run: node scripts/stage-installers.mjs

      - name: Upload ${{ matrix.os_label }} installers artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os_folder }}
          path: installers/${{ matrix.os_folder }}/
          if-no-files-found: error

  collect-and-release:
    name: Copy Installers to OS Folders & Publish Release
    needs: build-installers
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ startsWith(github.ref, 'refs/heads/') && github.ref_name || '' }}
          fetch-depth: 0

      - name: Clear previous staged binaries while keeping OS README files
        run: find installers/macos installers/windows installers/linux -type f ! -name 'README.md' -delete

      - name: Copy macOS installers into installers/macos/
        uses: actions/download-artifact@v4
        with:
          name: installers-macos
          path: installers/macos

      - name: Copy Windows installers into installers/windows/
        uses: actions/download-artifact@v4
        with:
          name: installers-windows
          path: installers/windows

      - name: Copy Linux installers into installers/linux/
        uses: actions/download-artifact@v4
        with:
          name: installers-linux
          path: installers/linux

      - name: Verify installers and README files per OS folder
        run: ls -la installers/macos installers/windows installers/linux installers/chromeos

      - name: Commit compiled installers to OS folders on branch
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installers/macos installers/windows installers/linux
          if git diff --cached --quiet; then
            echo "No installer changes to commit."
            exit 0
          fi
          git commit -m "chore(installers): update compiled OS installers [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload combined multi-OS installers bundle
        uses: actions/upload-artifact@v4
        with:
          name: mutejar-installers-all-os
          path: installers/

      - name: Publish GitHub Release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Mute Jar ${{ github.ref_name }}
          body: |
            Single-file desktop installers for every operating system:
            - **macOS**: Universal `.dmg` (Apple Silicon & Intel)
            - **Windows**: `.exe` (NSIS) and `.msi`
            - **Linux**: `.AppImage` and `.deb`

            No Node.js or Docker required.
          files: |
            installers/macos/*.dmg
            installers/windows/*.exe
            installers/windows/*.msi
            installers/linux/*.AppImage
            installers/linux/*.deb
