name: Build & Release Desktop Installers

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-installers:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            os_folder: macos
            os_label: macOS (Universal .dmg)
          - platform: windows-latest
            args: ''
            os_folder: windows
            os_label: Windows (.exe / .msi)
          - platform: ubuntu-22.04
            args: ''
            os_folder: linux
            os_label: Linux (.AppImage / .deb)

    name: Build ${{ matrix.os_label }}
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust / Tauri build dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux WebKitGTK dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Type-check TypeScript
        run: npm run lint

      - name: Generate platform icons from app icon
        run: npm run desktop:icons

      - name: Build single-file OS installers
        run: npx --yes @tauri-apps/cli@^2 build ${{ matrix.args }}

      - name: Stage installers into OS folder
        run: node scripts/stage-installers.mjs

      - name: Verify macOS ad-hoc signature
        if: matrix.os_folder == 'macos'
        run: |
          for dmg in installers/macos/*.dmg; do
            echo "Inspecting signature for $dmg"
            codesign -dv --verbose=2 "$dmg" || true
          done

      - name: Detect optional free SignPath OSS secrets
        id: check-signing
        if: matrix.os_folder == 'windows'
        shell: bash
        env:
          SP_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SP_ORG: ${{ secrets.SIGNPATH_ORG_ID }}
        run: |
          if [ -n "$SP_TOKEN" ] && [ -n "$SP_ORG" ]; then
            echo "has_signpath=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signpath=false" >> "$GITHUB_OUTPUT"
            echo "SignPath secrets not configured yet; keeping unsigned Windows installers."
          fi

      - name: Upload unsigned Windows installers for SignPath
        id: upload-unsigned-windows
        if: matrix.os_folder == 'windows' && steps.check-signing.outputs.has_signpath == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows-installers
          path: |
            installers/windows/*.exe
            installers/windows/*.msi

      - name: Sign Windows installers via SignPath Foundation (Free OSS)
        if: matrix.os_folder == 'windows' && steps.check-signing.outputs.has_signpath == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'mute-jar' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG || 'default' }}
          github-artifact-id: ${{ steps.upload-unsigned-windows.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: installers/windows

      - name: Upload ${{ matrix.os_label }} installers artifact
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os_folder }}
          path: installers/${{ matrix.os_folder }}/
          if-no-files-found: error

  collect-and-release:
    name: Copy Installers to OS Folders & Publish Release
    needs: build-installers
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ startsWith(github.ref, 'refs/heads/') && github.ref_name || '' }}
          fetch-depth: 0

      - name: Clear previous staged binaries while keeping OS README files
        run: |
          find installers/macos installers/windows installers/linux -type f ! -name 'README.md' -delete
          rm -f installers/SHA256SUMS.txt installers/SHA256SUMS.txt.asc

      - name: Copy macOS installers into installers/macos/
        uses: actions/download-artifact@v8
        with:
          name: installers-macos
          path: installers/macos

      - name: Copy Windows installers into installers/windows/
        uses: actions/download-artifact@v8
        with:
          name: installers-windows
          path: installers/windows

      - name: Copy Linux installers into installers/linux/
        uses: actions/download-artifact@v8
        with:
          name: installers-linux
          path: installers/linux

      - name: Create versioned OS installer ZIP archives
        run: node scripts/package-installer-zips.mjs

      - name: Verify ZIP archive integrity and contents
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version)")
          for os in macos windows linux; do
            zip_file="installers/${os}/MuteJar_${VERSION}_${os}.zip"
            test -f "$zip_file"
            echo "=== Testing $zip_file ==="
            unzip -t "$zip_file"
            unzip -l "$zip_file"
            entries=$(unzip -Z1 "$zip_file")
            echo "$entries" | grep -qx "README.md"
            if echo "$entries" | grep -q '/'; then
              echo "ERROR: Expected flat root entries without subdirectories in $zip_file"
              exit 1
            fi
            if echo "$entries" | grep -qiE '\.zip$|SHA256SUMS|\.asc$'; then
              echo "ERROR: Unexpected ZIP or checksum file inside $zip_file"
              exit 1
            fi
            test -f "installers/${os}/README.md"
          done
          unzip -Z1 "installers/macos/MuteJar_${VERSION}_macos.zip" | grep -qE '^[^/]+\.dmg$'
          unzip -Z1 "installers/windows/MuteJar_${VERSION}_windows.zip" | grep -qE '^[^/]+\.(exe|msi)$'
          unzip -Z1 "installers/linux/MuteJar_${VERSION}_linux.zip" | grep -qE '^[^/]+\.(AppImage|deb)$'
          echo "Verified all platform ZIP archives contain built installers and README.md at root."

      - name: Generate SHA256SUMS.txt verification manifest
        run: node scripts/generate-checksums.mjs

      - name: Check optional free GPG signing key
        id: check-gpg
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_KEY" ]; then
            echo "has_gpg=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_gpg=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign SHA256SUMS.txt with GPG (optional free key)
        if: steps.check-gpg.outputs.has_gpg == 'true'
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASS: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          if [ -n "$GPG_PASS" ]; then
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASS" --armor --detach-sign installers/SHA256SUMS.txt
          else
            gpg --batch --yes --armor --detach-sign installers/SHA256SUMS.txt
          fi

      - name: Verify installers, checksums, and README files per OS folder
        run: |
          ls -la installers/macos installers/windows installers/linux installers/chromeos
          cat installers/SHA256SUMS.txt || true
          grep -q "macos/.*\.zip$" installers/SHA256SUMS.txt
          grep -q "windows/.*\.zip$" installers/SHA256SUMS.txt
          grep -q "linux/.*\.zip$" installers/SHA256SUMS.txt

      - name: Commit compiled installers and checksums to OS folders on branch
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installers/macos installers/windows installers/linux installers/SHA256SUMS.txt*
          if git diff --cached --quiet; then
            echo "No installer changes to commit."
            exit 0
          fi
          git commit -m "chore(installers): update compiled OS installers [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload combined multi-OS installers bundle
        uses: actions/upload-artifact@v7
        with:
          name: mutejar-installers-all-os
          path: installers/

      - name: Publish GitHub Release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: Mute Jar ${{ github.ref_name }}
          body: |
            Single-file desktop installers and bundled ZIP packages for every operating system:
            - **macOS**: Recommended `MuteJar_*_macos.zip` (`.dmg` + `README.md`) or direct Universal `.dmg` (Apple Silicon & Intel, ad-hoc signed)
            - **Windows**: `MuteJar_*_windows.zip` (`.exe` + `.msi` + `README.md`) or direct `.exe` (NSIS) / `.msi` (SignPath Foundation OSS signing when configured)
            - **Linux**: `MuteJar_*_linux.zip` (`.AppImage` + `.deb` + `README.md`) or direct `.AppImage` / `.deb`
            - **Verification**: `SHA256SUMS.txt` included for checksum validation across all installers and ZIPs

            No Node.js or Docker required.
          files: |
            installers/macos/*.dmg
            installers/macos/*.zip
            installers/windows/*.exe
            installers/windows/*.msi
            installers/windows/*.zip
            installers/linux/*.AppImage
            installers/linux/*.deb
            installers/linux/*.zip
            installers/SHA256SUMS.txt
            installers/SHA256SUMS.txt.asc
