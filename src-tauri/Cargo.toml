[package]
name = "mute-jar"
version = "1.0.0"
description = "Privacy-first meeting mute tracker and habit companion"
authors = ["Mute Jar Contributors"]
edition = "2021"

[lib]
name = "mute_jar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
