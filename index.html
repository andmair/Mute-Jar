    <!-- Suppress benign WebSocket closed errors from Vite HMR in iframe dev preview -->
    <script>
      (function() {
        // Intercept global error and unhandledrejection
        window.addEventListener('error', function (event) {
          var msg = (event && (event.message || (event.error && event.error.message))) || '';
          if (msg.indexOf('WebSocket') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var msg = (event && event.reason && (event.reason.message || event.reason)) || '';
          if (typeof msg === 'string' && msg.indexOf('WebSocket') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        // In the dev iframe environment, proxy WebSocket to simulate an opened socket so @vite/client never rejects
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          function SafeWebSocket(url, protocols) {
            var listeners = {};
            var self = {
              url: url,
              protocols: protocols,
              readyState: 1, // OPEN
              OPEN: 1,
              CONNECTING: 0,
              CLOSING: 2,
              CLOSED: 3,
              binaryType: 'blob',
              bufferedAmount: 0,
              extensions: '',
              protocol: '',
              send: function() {},
              close: function() {
                self.readyState = 3;
                if (listeners['close']) {
                  listeners['close'].forEach(function(fn) {
                    try { fn({ wasClean: true, code: 1000, reason: '' }); } catch (e) {}
                  });
                }
              },
              addEventListener: function(type, listener) {
                if (!listeners[type]) listeners[type] = [];
                listeners[type].push(listener);
                if (type === 'open') {
                  // Dispatch open on next microtask so @vite/client marks isOpened = true!
                  setTimeout(function() {
                    try { listener({ type: 'open' }); } catch (e) {}
                  }, 0);
                }
              },
              removeEventListener: function(type, listener) {
                if (!listeners[type]) return;
                listeners[type] = listeners[type].filter(function(l) { return l !== listener; });
              },
              dispatchEvent: function() { return true; }
            };
            return self;
          }
          SafeWebSocket.prototype = OrigWebSocket.prototype;
          SafeWebSocket.CONNECTING = 0;
          SafeWebSocket.OPEN = 1;
          SafeWebSocket.CLOSING = 2;
          SafeWebSocket.CLOSED = 3;
          window.WebSocket = SafeWebSocket;
        }
      })();
    </script>
