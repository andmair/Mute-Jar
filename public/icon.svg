<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Button Shadow -->
    <filter id="roundBtnShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Outer Round Button Radial Gradient -->
    <linearGradient id="roundBtnBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Button Rim Highlight Gradient -->
    <linearGradient id="roundBtnRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Red Pause Stripes Gradient -->
    <linearGradient id="redPauseStripe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4f"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Red Glow Filter for Pause Stripes -->
    <filter id="redStripeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ef4444" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Canvas Circle for Rounded App Icon & Maskable Compliance -->
  <circle cx="256" cy="256" r="236" fill="url(#roundBtnBase)" stroke="url(#roundBtnRim)" stroke-width="18" filter="url(#roundBtnShadow)"/>

  <!-- Inner Concentric Bevel Ring -->
  <circle cx="256" cy="256" r="212" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="6"/>

  <!-- Red Pause Stripes Group -->
  <g filter="url(#redStripeGlow)">
    <!-- Left Pause Stripe -->
    <rect x="176" y="140" width="56" height="232" rx="28" fill="url(#redPauseStripe)"/>
    <!-- Left Stripe Gloss Highlight -->
    <rect x="184" y="152" width="18" height="96" rx="9" fill="#ffffff" fill-opacity="0.32"/>

    <!-- Right Pause Stripe -->
    <rect x="280" y="140" width="56" height="232" rx="28" fill="url(#redPauseStripe)"/>
    <!-- Right Stripe Gloss Highlight -->
    <rect x="288" y="152" width="18" height="96" rx="9" fill="#ffffff" fill-opacity="0.32"/>
  </g>
</svg>
